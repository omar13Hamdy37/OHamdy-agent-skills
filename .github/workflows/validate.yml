name: Public deterministic validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install hashed runtime and developer dependencies
        run: python -m pip install --require-hashes -r plugins/cufe-study-guide/skills/cufe-study-guide/scripts/requirements.lock -r evals/cufe-study-guide/requirements.lock
      - name: Compile and run public checks
        run: |
          python -m compileall -q plugins/cufe-study-guide/skills/cufe-study-guide/scripts evals/cufe-study-guide
          python evals/cufe-study-guide/run_evals.py --deterministic
      # No source lecture, model calls, API credentials, or generated artifacts.
